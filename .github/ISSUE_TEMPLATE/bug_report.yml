name: Bug 报告
description: 蒸馏结果不对、报错、卡住 —— 报告一个 bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请把下面三项填全，能复现的问题修复最快：
        ① 什么视频（链接或站点 + 大致时长）
        ② 什么环境（系统 / Python / Node 版本）
        ③ `digest.md` 长什么样（片段即可，注意删掉敏感内容）

  - type: textarea
    id: video
    attributes:
      label: 什么视频
      placeholder: |
        链接：https://www.bilibili.com/video/BV1xxxxxxxxx
        或：YouTube 某视频，18 分钟，有官方字幕
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      placeholder: |
        操作系统：Windows 11
        Python：3.13.12
        Node：22.22.2
        是否起了两个常驻服务：是
    validations:
      required: true

  - type: textarea
    id: digest
    attributes:
      label: digest.md 片段
      description: 阶段 1 的素材包，唯一可信来源。贴 10~30 行即可
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果
      description: 哪里不对、应该是什么样
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际输出
      description: 报错信息或错误笔记片段，贴文本不要贴大图
      render: shell
    validations:
      required: true

  - type: input
    id: sessdata
    attributes:
      label: 是否配置了 SESSDATA
      description: 有无会影响是否走官方字幕
      placeholder: "有 / 没有"

  - type: checkboxes
    id: check
    attributes:
      label: 提交前确认
      options:
        - label: 我没有在 Issue 里粘贴 Cookie、token 或其他凭证
          required: true
        - label: 我已确认 work/ 目录、chunks/ 缓存、媒体文件未被我上传
          required: false
